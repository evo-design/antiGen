[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigen-model"
version = "0.2.1"
description = "Train sequence models of viral fitness and score amino-acid substitutions for any query sequence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Specht" }]
keywords = ["protein", "fitness", "viral evolution", "transformer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

# Core dependencies — enough for the hero path (from-scratch transformer + BLOSUM62):
# train on an examples file and run inference on a query FASTA. No model downloads.
dependencies = [
    "torch>=2.7",
    "numpy",
    "pandas",
    "biopython",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/evo-design/antiGen"
Issues = "https://github.com/evo-design/antiGen/issues"

[project.optional-dependencies]
# ESM-2 pretrained protein language model (via HuggingFace transformers).
esm = ["transformers"]
# EVcouplings mean-field DCA. Also requires the external `plmc` binary on PATH
# (or $PLMC_BINARY). The EVE and Tranception models are implemented in-repo and
# need no extra pip packages (only an MSA at run time).
dca = ["evcouplings"]
# Plotting helpers (not required by the core CLIs).
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
antiGen-train = "antiGen.train:main"
antiGen-infer = "antiGen.infer:main"
antiGen-eval = "antiGen.eval:main"
antiGen-validate-examples = "antiGen.validate_examples:main"
antiGen-top-decile = "antiGen.top_decile:main"

[tool.setuptools.packages.find]
# "antiGen.*" (with the dot) matches the package and its subpackages but NOT the
# hyphenated antiGen-data/ directory (the C++ tool, not a Python package).
include = ["antiGen", "antiGen.*"]
exclude = ["antiGen.tests*", "antiGen-data*"]

[tool.setuptools.package-data]
# configs, and the pretrained 2023-01-01 SARS-CoV-2 models (~25 MB; TUTORIAL.md).
"antiGen" = ["configs/*.yaml", "pretrained/*/*.pt", "pretrained/*/*/*.pt",
             "pretrained/examples/*.fasta"]

[tool.pytest.ini_options]
testpaths = ["antiGen/tests"]
